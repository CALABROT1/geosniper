<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>GeoSniper — Painel</title>
<meta http-equiv="refresh" content="0; url=https://api.geosniper.com.br/admin.html">
<style>
  :root {
    --bg: #15160f;
    --surface: #1d1f16;
    --line: #3a3d2e;
    --ink: #e9e4d2;
    --muted: #93927c;
    --accent: #c39a4f;
  }
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px; max-width: 420px; text-align: center; }
  .card h1 { margin: 0 0 8px; font-size: 18px; }
  .card h1 span { color: var(--accent); }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card a { display: inline-block; padding: 10px 18px; background: var(--accent); color: #17231a; border-radius: 6px; font-weight: 700; text-decoration: none; }
</style>
<script>location.replace('https://api.geosniper.com.br/admin.html');</script>
</head>
<body>
  <div class="card">
    <h1>GeoSniper — <span>Painel</span></h1>
    <p>Este endereço foi descontinuado. O painel administrativo agora fica em api.geosniper.com.br. Redirecionando…</p>
    <a href="https://api.geosniper.com.br/admin.html">Ir para o painel agora</a>
  </div>
</body>
</html>
